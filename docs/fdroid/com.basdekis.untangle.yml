Categories:
  - Games
License: MIT
SourceCode: https://github.com/nektariosb/untangle
IssueTracker: https://github.com/nektariosb/untangle/issues

AutoName: Untangle

RepoType: git
Repo: https://github.com/nektariosb/untangle.git

Builds:
  - versionName: 1.0.1
    versionCode: 2
    commit: v1.0.1
    output: build/app/outputs/flutter-apk/app-release.apk
    srclibs:
      - flutter@3.44.4
    rm:
      - ios
      - web
    prebuild:
      - export PUB_CACHE=$(pwd)/.pub-cache
      - $$flutter$$/bin/flutter config --no-analytics
      - $$flutter$$/bin/flutter pub get
      - sed -i -e '/signingConfig = /d' android/app/build.gradle.kts
    scandelete:
      - .pub-cache
    build:
      - export PUB_CACHE=$(pwd)/.pub-cache
      - $$flutter$$/bin/flutter build apk --release
    ndk: r28c

AutoUpdateMode: Version
UpdateCheckMode: Tags
UpdateCheckData: pubspec.yaml|version:\s.+\+(\d+)|.|version:\s(.+)\+
CurrentVersion: 1.0.1
CurrentVersionCode: 2
